services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet_app
      POSTGRES_PASSWORD: ${WALLET_DB_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - wallet-postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wallet_app -d wallet" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wallet-postgres:
